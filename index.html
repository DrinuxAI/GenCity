<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenCity — L'ufficio dei tuoi agenti</title>
<style>
:root{
  --bg1:#0d1130;--bg2:#151a3d;--panel:#0d1126;--line:#2c3357;--line2:#262c4d;
  --txt:#eef2ff;--muted:#9fb0d8;--amber:#ffcf5c;--red:#ff5d6c;--gray:#7c86b8;--gold:#ffd66b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;
  color:var(--txt);background:linear-gradient(180deg,#0c1030 0%,#12163c 55%,#1a1145 100%);
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
   radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.5) 50%,transparent 51%),
   radial-gradient(1px 1px at 28% 8%,rgba(255,255,255,.35) 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 45% 14%,rgba(255,255,255,.4) 50%,transparent 51%),
   radial-gradient(1px 1px at 63% 6%,rgba(255,255,255,.45) 50%,transparent 51%),
   radial-gradient(1px 1px at 78% 20%,rgba(255,255,255,.3) 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 90% 10%,rgba(255,255,255,.35) 50%,transparent 51%),
   radial-gradient(1px 1px at 55% 28%,rgba(255,255,255,.25) 50%,transparent 51%),
   radial-gradient(1px 1px at 8% 40%,rgba(255,255,255,.2) 50%,transparent 51%);
}
header#topbar{height:58px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);background:rgba(13,17,38,.75);backdrop-filter:blur(8px);z-index:6}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.4px}
.brand p{font-size:11px;color:var(--muted)}
.stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#131735;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:#fff;font-weight:600}
.chip.alert b{color:var(--red)}
.chip.alert.on{border-color:rgba(255,93,108,.45);background:#241322}
.chip.clock b{color:var(--gold)}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer}
.switch input{display:none}
.switch .trk{width:34px;height:18px;border-radius:999px;background:#2c3357;position:relative;transition:.2s;flex:0 0 auto}
.switch .trk::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#9fb0d8;transition:.2s}
.switch input:checked+.trk{background:#39d0c4}
.switch input:checked+.trk::after{left:18px;background:#0d1130}
main#stage{flex:1;position:relative;display:flex;overflow:hidden}
#citywrap{flex:1;position:relative;min-width:0}
#city{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#city.dragging{cursor:grabbing}
.zoom{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(13,17,38,.9);
  color:#cfe3ff;font-size:16px;cursor:pointer;line-height:1}
.zoom button:hover{border-color:#4c558f;background:#1a2044}
#tooltip{position:fixed;z-index:20;pointer-events:none;background:#10142e;border:1px solid #39406e;border-radius:10px;
  padding:8px 11px;font-size:12px;display:flex;flex-direction:column;gap:2px;max-width:240px;
  opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tooltip.on{opacity:1}
#tooltip b{color:#fff;font-size:12.5px}
#tooltip span{color:var(--muted)}
aside#panel{position:absolute;top:12px;right:12px;bottom:12px;width:400px;max-width:calc(100vw - 24px);
  background:rgba(13,16,38,.97);border:1px solid var(--line);border-radius:16px;z-index:8;
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:-12px 0 40px rgba(0,0,0,.4)}
aside#panel.open{transform:translateX(0)}
.p-head{padding:14px 16px 0;border-bottom:1px solid var(--line2)}
.p-title-row{display:flex;align-items:center;gap:9px}
#p-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
#p-title{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#p-close{border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:8px}
#p-close:hover{color:#fff;background:#1a2044}
.p-sub{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  font-size:12.5px;font-weight:600;padding:9px 0;cursor:pointer}
.tabs button.active{color:#fff;border-bottom-color:var(--gold)}
#panel.plaza .tabs{display:none}
.p-body{flex:1;overflow-y:auto;padding:14px 16px}
.p-body::-webkit-scrollbar{width:8px}
.p-body::-webkit-scrollbar-thumb{background:#2c3357;border-radius:8px}
.msg{display:flex;gap:9px;margin-bottom:12px}
.msg .av{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:#0d1130}
.msg .bub{background:#141938;border:1px solid var(--line2);border-radius:4px 12px 12px 12px;padding:8px 11px;min-width:0}
.msg .mh{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.msg .mh b{font-size:12.5px}
.msg .mh i{font-size:10.5px;color:var(--muted);font-style:normal}
.msg p{font-size:12.5px;line-height:1.45;color:#d7e1f7;word-wrap:break-word}
.msg.sys{justify-content:center}
.msg.sys span{background:#131735;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:11.5px;color:var(--muted)}
.msg.sys em{display:none}
.agent-card{display:flex;gap:11px;background:#131735;border:1px solid var(--line2);border-radius:12px;padding:11px;margin-bottom:10px}
.agent-card .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#0d1130}
.ac-main{flex:1;min-width:0}
.ac-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ac-row b{font-size:13px}
.ac-row span{font-size:11px;color:var(--muted)}
.ac-status{display:flex;align-items:center;gap:8px;margin:6px 0 7px}
.ac-status .task{font-size:11.5px;color:#c6d3ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:#20264a;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
.log-line{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid #1a2044;font-size:12px}
.log-line i{font-style:normal;color:var(--muted);font-size:11px;flex:0 0 42px;padding-top:1px}
.log-line span{color:#d7e1f7}
.ov-row{background:#131735;border:1px solid var(--line2);border-left-width:3px;border-radius:10px;
  padding:10px 12px;margin-bottom:9px;cursor:pointer}
.ov-row:hover{background:#181d40}
.ov-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.ov-top b{font-size:13px}
.ov-mid{display:flex;align-items:center;gap:6px}
.ov-mid i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.ov-last{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
.p-foot button{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#141938;
  color:#cfe3ff;font-size:12.5px;font-weight:600;cursor:pointer}
.p-foot button:hover{border-color:#4c558f;background:#1a2044}
footer#tickerbar{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 18px;border-top:1px solid var(--line);background:rgba(13,17,38,.75);font-size:12px;z-index:6}
.legend{display:flex;gap:14px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:50%}
#ticker-last{color:#c6d3ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right;min-width:0}
#toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%) translateY(8px);background:#10142e;
  border:1px solid #39406e;color:#eef2ff;font-size:12.5px;padding:9px 16px;border-radius:999px;z-index:30;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bld{cursor:pointer}
.bld-label{cursor:pointer}
.bld-label:hover rect{stroke-width:2.5}
.robot{cursor:pointer}
.bld-light.st-working{fill:var(--amber)}
.bld-light.st-idle{fill:#59628f}
.bld-light.st-attention{fill:var(--red);animation:lightp 1s ease-in-out infinite}
@keyframes lightp{50%{opacity:.3}}
.robot .body-g{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.robot.st-idle .body-g,.robot.st-attention .body-g{animation:none}
.robot.st-idle{opacity:.82}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.robot .antenna{transition:.2s}
.robot.st-working .antenna{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.1}}
.robot .alert-ring circle{opacity:0}
.robot.st-attention .alert-ring{transform-box:fill-box;transform-origin:center;animation:ringp 1.2s ease-out infinite}
.robot.st-attention .alert-ring circle{opacity:.9}
@keyframes ringp{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.bubble{transition:opacity .3s}
.beacon{cursor:pointer}
.beacon-ring{transform-box:fill-box;transform-origin:center;animation:ringp 2.6s ease-out infinite}
.beacon-ring circle{opacity:.7}
.tmp-bubble{transform-box:fill-box;transform-origin:50% 100%;animation:tmp 6s ease forwards}
@keyframes tmp{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0}}
.ad-back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:10px;padding:3px 9px;border-radius:8px;border:1px solid var(--line2)}
.ad-back:hover{color:#fff;background:#1a2044}
.agent-hero{display:flex;align-items:center;gap:12px;background:#131735;border:1px solid var(--line2);border-radius:12px;padding:12px;margin-bottom:14px}
.agent-hero .av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#0d1130}
.agent-hero b{display:block;font-size:15px}
.agent-hero .r{display:block;font-size:11.5px;color:var(--muted)}
.agent-hero .pill{margin-left:auto}
.ad-sec{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.ad-task{font-size:13px;color:var(--txt);margin-bottom:8px}
.ad-pct{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
.ad-actions{display:flex;gap:8px;margin-top:16px}
.ad-actions button{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#141938;color:#cfe3ff;font-size:12.5px;font-weight:600;cursor:pointer}
.ad-actions button:hover{border-color:#4c558f;background:#1a2044}
.ad-empty{font-size:12px;color:var(--muted);padding:6px 0}
@media (max-width:820px){
  .chip.opt{display:none}
  .legend{display:none}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <rect x="5" y="9" width="14" height="10" rx="3" fill="#8f7bff"/>

      <rect x="10" y="6" width="4" height="2" rx="1" fill="#0d1130"/>
      <line x1="12" y1="3.5" x2="12" y2="1.6" stroke="#ffd66b" stroke-width="1.5"/>

    </svg>
    <div><h1>GenCity</h1><p>L'ufficio dei tuoi agenti</p></div>
  </div>
  <div class="stats">
    <span class="chip opt"><b id="st-proj">0</b> progetti</span>

    <span class="chip clock"><b id="st-clock">09:00</b></span>

  </div>
</header>
<main id="stage">
  <div id="citywrap">
    <svg id="city" viewBox="0 0 1600 680" preserveAspectRatio="xMidYMid meet"><g id="world"></g></svg>
    <div class="zoom">

      <button id="zout" title="Zoom −">−</button>

    <div id="tooltip"></div>
  </div>
  <aside id="panel">
    <div class="p-head">
      <div class="p-title-row"><span id="p-dot"></span><h2 id="p-title"></h2><button id="p-close" title="Chiudi">×</button></div>
      <div class="p-sub"><span id="p-proj"></span><span class="pill" id="p-status"></span></div>
      <div class="tabs">
        <button data-tab="chat" class="active">Dialogo</button>
        <button data-tab="team">Team</button>
        <button data-tab="log">Log</button>
      </div>
    </div>
    <div class="p-body" id="p-body"></div>
    <div class="p-foot">
      <button id="p-open">Apri in GenTeam</button>
      <button id="p-sim">+ Messaggio demo</button>
    </div>
  </aside>
</main>
<footer id="tickerbar">
  <div class="legend">

    <span><i style="background:var(--red)"></i>Attenzione</span>
    <span><i style="background:var(--gray)"></i>In pausa</span>
    <span><i style="background:var(--gold)"></i>Command Center</span>
  </div>
  <div id="ticker-last"></div>
</footer>
<div id="toast"></div>

function buildGround(){

function viewScale(){const r=svg.getBoundingClientRect();return Math.min(r.width/1600,r.height/680);}
function toUser(e){
  const r=svg.getBoundingClientRect(),s=viewScale();
  const ox=(r.width-1600*s)/2,oy=(r.height-680*s)/2;
  return{x:(e.clientX-r.left-ox)/s,y:(e.clientY-r.top-oy)/s};

function zoomAt(ux,uy,f){
  const ns=Math.min(1.9,Math.max(0.45,view.s*f));
  view.x=ux-(ux-view.x)*(ns/view.s);
  view.y=uy-(uy-view.y)*(ns/view.s);
  view.s=ns;applyView();
}
let drag=null;
svg.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,moved:0};svg.classList.add("dragging");svg.setPointerCapture(e.pointerId);});
svg.addEventListener("pointermove",e=>{
  if(drag){
    const s=viewScale(),dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    drag.moved+=Math.abs(dx)+Math.abs(dy);
    view.x+=dx/s;view.y+=dy/s;
    drag.x=e.clientX;drag.y=e.clientY;
    applyView();
  }else tooltipMove(e);
});
svg.addEventListener("pointerup",e=>{
  svg.classList.remove("dragging");
  if(drag&&drag.moved<6){
    const t=e.target.closest("[data-chatid],[data-agentid],[data-plaza]");
    if(t){
      if(t.dataset.agentid){openAgent(t.dataset.agentid);}
      else if(t.dataset.chatid){cur.tab="chat";openChat(t.dataset.chatid);}
      else{cur.chat="plaza";renderPanel();panel.classList.add("open");}

  }

    '<div class="ad-sec">Sta facendo ora</div>'+
    '<div class="ad-task">'+esc(a.task)+'</div>'+
    '<div class="bar"><i style="width:'+a.progress+'%;background:'+col+'"></i></div>'+
    '<div class="ad-pct">'+a.progress+'% completato</div>'+
    '<div class="ad-sec">Ultimi interventi</div>'+
    (msgs.length?msgs.map(m=>'<div class="log-line"><i>'+m.time+'</i><span>'+esc(m.text)+'</span></div>').join(""):'<div class="ad-empty">Nessun intervento recente.</div>')+
    '<div class="ad-actions"><button id="ad-dm">Apri DM in GenTeam</button><button id="ad-chat">Chat di gruppo</button></div>';
}
function renderPanel(){
  const body=$("#p-body");
  const sc=body.scrollTop;
  if(cur.agent){
    const a=AGENTS[cur.agent],c=a.chat,col=PROJECTS[c.project].color;
    panel.classList.remove("plaza");
    $("#p-sim").style.display="none";
    $("#p-dot").style.background=col;
    $("#p-title").textContent=a.name;
    $("#p-proj").textContent=a.role+" · "+c.name;
    const pill=$("#p-status");
    pill.textContent=ST_LABEL[a.status];
    pill.style.color=ST_COLOR[a.status];pill.style.background=ST_COLOR[a.status]+"22";pill.style.borderColor=ST_COLOR[a.status]+"55";
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    body.innerHTML=agentDetailHTML(a);
    body.scrollTop=sc;
    return;
  }
  const isPlaza=cur.chat==="plaza";
  panel.classList.toggle("plaza",isPlaza);
  $("#p-sim").style.display=(isPlaza||liveMode)?"none":"block";
  if(isPlaza){
    $("#p-dot").style.background="#ffd66b";
    $("#p-title").textContent="Command Center";
    $("#p-proj").textContent="Panoramica di tutte le chat";
    const n=CHATS.reduce((k,c)=>k+c.agents.filter(a=>a.status==="attention").length,0);
    const pill=$("#p-status");
    if(n>0){pill.textContent=n+" in attenzione";pill.style.color=ST_COLOR.attention;pill.style.background=ST_COLOR.attention+"22";pill.style.borderColor=ST_COLOR.attention+"55";}
    else{pill.textContent="Tutto in movimento";pill.style.color=ST_COLOR.working;pill.style.background=ST_COLOR.working+"22";pill.style.borderColor=ST_COLOR.working+"55";}
    body.innerHTML=overviewHTML();
  }else{
    const c=CHATS.find(x=>x.id===cur.chat);
    if(!c)return closePanel();
    const st=chatStatus(c),col=PROJECTS[c.project].color;
    $("#p-dot").style.background=col;
    $("#p-title").textContent=c.name;
    $("#p-proj").textContent=PROJECTS[c.project].name+" · "+c.agents.length+" agenti";
    const pill=$("#p-status");
    pill.textContent=ST_LABEL[st];
    pill.style.color=ST_COLOR[st];pill.style.background=ST_COLOR[st]+"22";pill.style.borderColor=ST_COLOR[st]+"55";
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===cur.tab));
    if(cur.tab==="chat")body.innerHTML=chatHTML(c);
    else if(cur.tab==="team")body.innerHTML=teamHTML(c);
    else body.innerHTML=logHTML(c);
  }
  body.scrollTop=isPlaza?0:sc;
}
$("#p-close").addEventListener("click",closePanel);
$("#p-body").addEventListener("click",e=>{
  if(e.target.closest("[data-back]")){cur.agent=null;cur.tab="chat";renderPanel();return;}
  if(e.target.id==="ad-chat"){cur.agent=null;cur.tab="chat";renderPanel();return;}
  if(e.target.id==="ad-dm"&&cur.agent){dmOpen(AGENTS[cur.agent]);return;}
  const r=e.target.closest("[data-open]");
  if(r){cur.agent=null;cur.tab="chat";openChat(r.dataset.open);}
});
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]");
  if(b){cur.agent=null;cur.tab=b.dataset.tab;renderPanel();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel();});
let toastT;
function toast(t){
  const el=$("#toast");el.textContent=t;el.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);
}
$("#p-open").addEventListener("click",()=>{window.open(CONFIG.genteamUrl,"_blank");});
$("#p-sim").addEventListener("click",()=>{
  if(cur.chat&&cur.chat!=="plaza")simMessage(cur.chat);
});
function transientBubble(chat,agent,text){
  const i=chat.agents.indexOf(agent);
  const pos=agentPos(chat,i,chat.agents.length);
  const proj=PROJECTS[chat.project];
  const el=document.createElementNS("http://www.w3.org/2000/svg","g");
  el.setAttribute("transform","translate("+pos.x.toFixed(1)+","+(pos.y-58).toFixed(1)+")");
  el.innerHTML='<g class="tmp-bubble"><rect x="-72" y="-22" width="144" height="24" rx="8" fill="#10142e" stroke="'+proj.color+'" stroke-width="1"/>'+
    '<text x="0" y="-6" text-anchor="middle" font-size="10.5" fill="#ffe9b8">'+esc(trunc(text,28))+'</text></g>';
  fx.appendChild(el);
  setTimeout(()=>el.remove(),6200);
}
function addMessage(c,a,text){
  c.messages.push({from:a.id,text,time:fmtClock()});
  if(c.messages.length>40)c.messages.splice(0,c.messages.length-40);
}
function addLog(c,time,text){
  c.activity.push({time,text});
  if(c.activity.length>30)c.activity.splice(0,c.activity.length-30);
}
function ticker(t){$("#ticker-last").textContent=t;}
function simMessage(chatId){
  const c=CHATS.find(x=>x.id===chatId);if(!c)return;
  const a=c.agents[Math.floor(Math.random()*c.agents.length)];
  const text=MSG_POOL[Math.floor(Math.random()*MSG_POOL.length)];
  addMessage(c,a,text);
  transientBubble(c,a,text);
  ticker(a.name+" · "+text);
  if(panel.classList.contains("open"))renderPanel();
}
function refreshDynamic(){
  for(const c of CHATS){
    c.agents.forEach(a=>{
      const el=ROBOT_EL[a.id];if(!el)return;
      el.g.setAttribute("class","robot st-"+a.status);
      el.visor.setAttribute("fill",VISOR[a.status]);
      const show=a.status==="working"||a.status==="attention";
      el.bubble.setAttribute("opacity",show?"1":"0");
      if(show)el.bt.textContent=trunc(a.task,26);
    });
    const l=LIGHT_EL[c.id];
    if(l)l.setAttribute("class","bld-light st-"+chatStatus(c));
  }
}
function updateStats(){
  if(liveMode)clockMin=new Date().getHours()*60+new Date().getMinutes();
  const total=CHATS.reduce((n,c)=>n+c.agents.length,0);
  const working=CHATS.reduce((n,c)=>n+c.agents.filter(a=>a.status==="working").length,0);
  const attention=CHATS.reduce((n,c)=>n+c.agents.filter(a=>a.status==="attention").length,0);
  $("#st-proj").textContent=Object.keys(PROJECTS).length;
  $("#st-chats").textContent=CHATS.length;
  $("#st-active").textContent=working+" / "+total;
  $("#st-alert").textContent=attention;
  $("#st-clock").textContent=fmtClock();
  $("#st-alert-chip").classList.toggle("on",attention>0);
}
function tick(){
  clockMin+=2+Math.floor(Math.random()*3);
  const all=[];
  CHATS.forEach(c=>c.agents.forEach(a=>all.push({a,c})));
  const working=all.filter(x=>x.a.status==="working");
  if(working.length&&Math.random()<0.85){
    const w=working[Math.floor(Math.random()*working.length)];
    w.a.progress=Math.min(100,w.a.progress+6+Math.floor(Math.random()*16));
    if(w.a.progress>=100){
      addMessage(w.c,w.a,"Completato: "+w.a.task+".");
      addLog(w.c,fmtClock(),w.a.name+" ha completato: "+w.a.task);
      transientBubble(w.c,w.a,"Fatto!");
      ticker(w.a.name+" ha completato \""+w.a.task+"\" in "+w.c.name);
      w.a.status="idle";w.a.task="In pausa";w.a.progress=0;
    }
  }
  all.forEach(x=>{
    if(x.a.status==="idle"&&Math.random()<0.16){
      x.a.status="working";
      x.a.task=TASKS[Math.floor(Math.random()*TASKS.length)];
      x.a.progress=5+Math.floor(Math.random()*25);
      addLog(x.c,fmtClock(),x.a.name+" ha avviato: "+x.a.task);
      transientBubble(x.c,x.a,x.a.task);
    }
    if(x.a.status==="attention"){
      x.a.attT=(x.a.attT||1)-1;
      if(x.a.attT<=0){
        x.a.status="idle";x.a.task="In pausa";x.a.progress=0;
        addLog(x.c,fmtClock(),x.a.name+" ha ripreso il lavoro dopo il blocco");
        ticker(x.a.name+" è di nuovo operativo in "+x.c.name);
      }
    }
  });
  if(Math.random()<0.4){
    const c=CHATS[Math.floor(Math.random()*CHATS.length)];
    const a=c.agents[Math.floor(Math.random()*c.agents.length)];
    const text=MSG_POOL[Math.floor(Math.random()*MSG_POOL.length)];
    addMessage(c,a,text);
    transientBubble(c,a,text);
    ticker(a.name+" · "+text);
  }
  const hasAtt=all.some(x=>x.a.status==="attention");
  if(!hasAtt&&Math.random()<0.09){
    const x=all[Math.floor(Math.random()*all.length)];
    if(x.a.status!=="attention"){
      x.a.status="attention";
      x.a.task="Bloccato: serve un input umano";
      x.a.attT=4;
      addLog(x.c,fmtClock(),"Attenzione: "+x.a.name+" è bloccato e chiede un input");
      ticker(x.a.name+" è bloccato in "+x.c.name+" — serve te");
    }
  }
  refreshDynamic();
  updateStats();
  if(panel.classList.contains("open"))renderPanel();
}
function applyData(json){
  liveMode=true;
  PROJECTS=json.projects&&Object.keys(json.projects).length?json.projects:DEMO_PROJECTS;
  CHATS=json.chats.map((c,i)=>Object.assign({},c,{pos:{x:POSITIONS[i%POSITIONS.length][0],y:POSITIONS[i%POSITIONS.length][1]}}));
  buildCity();
  if(json.mode==="full")ticker("GenTeam collegato: "+CHATS.length+" edifici con dialogo live");
  else ticker("GenTeam collegato (privacy: solo stati) — "+CHATS.length+" edifici. Aggiornato "+(json.generated_at||"").slice(11,16));
}
async function refreshLive(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(!r.ok)return;
    const prev={};CHATS.forEach(c=>prev[c.id]=c.messages.length);
    const json=await r.json();
    applyData(json);
    CHATS.forEach(c=>{
      if((prev[c.id]||0)<c.messages.length&&c.agents.length)transientBubble(c,c.agents[0],"Nuovi messaggi");
    });
    updateStats();
  }catch(e){}
}
async function boot(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(r.ok){applyData(await r.json());startTimers();return;}
  }catch(e){}
  buildCity();
  ticker("Modalità demo — dati simulati. Esegui bridge.py per collegare GenTeam.");
  startTimers();
}
let live=true,fakeTimer=null,refetchTimer=null;
function startTimers(){
  clearInterval(fakeTimer);clearInterval(refetchTimer);
  if(!live)return;
  if(liveMode)refetchTimer=setInterval(refreshLive,60000);
  else fakeTimer=setInterval(tick,5000);
}
$("#live").addEventListener("change",e=>{
  live=e.target.checked;
  startTimers();
  toast(live?"Live attivata":"Live in pausa");
});
boot();
</script>
</body>
</html>
