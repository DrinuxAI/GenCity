<!doctype html>
<html lang="it">
<head>

<style>
:root{--bg:#eef1f7;--card:#ffffff;--line:#e3e7f0;--line2:#eef1f7;--ink:#1c2340;--sub:#6b7299;--gold:#e8b93c;--amber:#ffcf5c;--red:#ff5d6c;--gray:#7c86b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:18px;padding:0 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;font-size:15px}
.brand b{font-size:17px;letter-spacing:.3px}
.brand span{color:var(--sub);font-size:12px}
.tstats{display:flex;gap:16px;margin-left:auto}
.tstat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.tstat b{font-size:15px}
.tstat span{font-size:10px;color:var(--sub);letter-spacing:.4px;text-transform:uppercase}
.switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer;margin-left:8px}

#wrap{position:fixed;inset:56px 0 34px 0}
#scene{position:absolute;inset:0}
#scene canvas{display:block}
.lbl{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.94);border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;text-align:center;box-shadow:0 4px 14px rgba(28,35,64,.10);transform:translateY(-6px);transition:box-shadow .15s}
.lbl:hover{border-color:#4c558f}

.lbl.att{border-color:var(--red);box-shadow:0 4px 16px rgba(255,93,108,.25)}
.lbl.plaza-lbl{background:#fffdf2;border-color:var(--gold)}

.bub3d.out{opacity:0}
#tooltip{position:fixed;z-index:40;pointer-events:none;background:#10142e;color:#eef2ff;border-radius:9px;padding:7px 11px;font-size:12px;max-width:260px;box-shadow:0 8px 22px rgba(16,20,46,.3);opacity:0;transition:opacity .12s}
#tooltip.on{opacity:1}
#tooltip b{display:block;font-size:12.5px}
#tooltip span{color:#aab2d8;font-size:11px}
#panel{position:fixed;top:66px;right:14px;bottom:44px;width:380px;max-width:calc(100vw - 28px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(28,35,64,.16);display:flex;flex-direction:column;transform:translateX(420px);transition:transform .28s cubic-bezier(.2,.8,.25,1);z-index:35}
#panel.open{transform:none}
.p-head{padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.p-title-row{display:flex;align-items:center;gap:8px}

#p-title{font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#p-close{border:none;background:none;font-size:20px;color:var(--sub);cursor:pointer;line-height:1;padding:2px 6px}
#p-close:hover{color:var(--ink)}
.p-sub{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--sub)}
.pill{font-size:10px;padding:2px 9px;border-radius:20px;border:1px solid;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-top:11px;background:#f2f4fa;border-radius:9px;padding:3px}

.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(28,35,64,.12)}
.p-body{flex:1;overflow-y:auto;padding:14px 16px}
.p-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
.p-foot button{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#f7f8fc;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer}

.av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.bub{background:#f5f6fb;border-radius:12px;padding:7px 11px;min-width:0}
.mh{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.mh b{font-size:12px}
.mh i{font-style:normal;font-size:10px;color:var(--sub)}

.ov-top{display:flex;justify-content:space-between;gap:8px;align-items:center}

.ov-mid{display:flex;gap:5px;align-items:center;margin-top:5px}

.ad-back{color:var(--sub);font-size:12px;cursor:pointer;margin-bottom:10px}

.ad-task{font-size:13px;background:#f7f8fc;border-radius:10px;padding:9px 12px}
.ad-pct{font-size:11px;color:var(--sub);margin-top:4px;text-align:right}
.ad-empty{font-size:12px;color:var(--sub);background:#f7f8fc;border:1px dashed var(--line);border-radius:10px;padding:12px;line-height:1.5}

.ad-actions button:hover{border-color:#4c558f;background:#fff}
#tickerbar{position:fixed;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:18px;padding:0 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);font-size:11.5px;z-index:30}
.legend{display:flex;gap:14px;color:var(--sub)}
.legend span{display:flex;gap:5px;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#ticker-last{margin-left:auto;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;bottom:48px;left:50%;transform:translate(-50%,16px);background:#10142e;color:#fff;padding:9px 16px;border-radius:11px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:50}

#office-back:hover{background:#e6e9f4}
#office-title{font-size:14px}
#office-open{color:#2563eb;font-size:12px;text-decoration:none;font-weight:600}
.lbl{cursor:pointer}
.hint3d{position:absolute;left:16px;bottom:14px;font-size:11px;color:var(--sub);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:9px;padding:6px 10px;pointer-events:none}
@media(max-width:760px){#panel{width:calc(100vw - 20px)}.tstat span{display:none}}
</style>

<body>
<header id="topbar">
  <div class="brand">🏙 <b>GenCity</b><span>Ufficio GenTeam — live</span></div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {CSS2DRenderer,CSS2DObject} from "three/addons/renderers/CSS2DRenderer.js";

const CONFIG={dmUrlTemplate:"",chatUrlTemplate:"https://www.genspark.ai/genteam/{slug}/channel/{id}",genteamUrl:"https://www.genspark.ai/agents",serverSlug:"genspark"};
const ST_LABEL={working:"Al lavoro",attention:"Attenzione",idle:"In pausa"};
const ST_COLOR={working:0xffcf5c,attention:0xff5d6c,idle:0x7c86b8};
const ST_CSS={working:"#d99a00",attention:"#e03a48",idle:"#7c86b8"};
const POSITIONS=[[0,1],[2,1],[6,1],[8,1],[1,2],[7,2],[1,4],[7,4],[0,5],[2,5],[6,5],[8,5],[2,0],[6,0],[2,6],[6,6],[0,7],[8,7]];
const SLOT_SP=88;
const B_HEIGHT={hq:98,studio:64,lab:82,workshop:54};
const DEMO_PROJECTS={cosmetica:{name:"Cosmetica",color:"#ff6fae"},medtech:{name:"MedTech",color:"#39d0c4"},digitale:{name:"Digitale & AI",color:"#8f7bff"}};
const DEMO_CHATS=[
 {id:"demo-1",name:"Cosmetic Launch X",project:"cosmetica",type:"hq",unread:0,last_activity:null,needs_marco:false,marco_mentioned:false,
  agents:[{id:"nova",name:"Nova",role:"Stratega di lancio",status:"working",task:"Piano lancio Q1",progress:62},{id:"vega",name:"Vega",role:"Copywriter",status:"working",task:"Copy packaging",progress:38},{id:"atlas",name:"Atlas",role:"Analista",status:"idle",task:"In pausa",progress:0}],
  messages:[{from:"nova",text:"Kickoff chiuso: obiettivo Q1, budget approvato. Partiamo.",time:"09:02"},{from:"vega",text:"Parto con la copy del packaging, prima bozza entro stasera.",time:"09:05"}],
  activity:[{time:"09:05",text:"Vega: copy packaging avviato"},{time:"09:02",text:"Kickoff completato"}]},
 {id:"demo-2",name:"Regulatory InfoFile",project:"cosmetica",type:"lab",unread:2,last_activity:null,needs_marco:true,marco_mentioned:true,
  agents:[{id:"iris",name:"Iris",role:"Compliance",status:"attention",task:"Bloccata: claim da confermare",progress:78},{id:"echo",name:"Echo",role:"Ricercatrice",status:"working",task:"Scan letteratura",progress:40}],
  messages:[{from:"iris",text:"Serve una conferma sui claim prima di chiudere il dossier.",time:"10:12"}],
  activity:[{time:"10:12",text:"Iris chiede conferma claim"}]},
 {id:"demo-3",name:"AI Ops",project:"digitale",type:"studio",unread:0,last_activity:null,needs_marco:false,marco_mentioned:false,
  agents:[{id:"byte",name:"Byte",role:"DevOps",status:"working",task:"Pipeline deploy",progress:55}],
  messages:[{from:"byte",text:"Pipeline verde, deploy in rollout.",time:"11:30"}],
  activity:[{time:"11:30",text:"Deploy in rollout"}]},
 {id:"demo-4",name:"MedTech Desk",project:"medtech",type:"workshop",unread:0,last_activity:null,needs_marco:false,marco_mentioned:false,
  agents:[{id:"volt",name:"Volt",role:"Hardware",status:"idle",task:"In pausa",progress:0}],
  messages:[{from:"volt",text:"Prototipo in test bancario fino a stasera.",time:"08:40"}],
  activity:[{time:"08:40",text:"Test bancario avviato"}]}
];
let PROJECTS=DEMO_PROJECTS,CHATS=DEMO_CHATS,AGENTS={},liveMode=false,clockMin=9*60;
let NIGHT=false;
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function trunc(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1)+"…":s;}
function fmtClock(){const h=Math.floor(clockMin/60)%24,m=clockMin%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");}
function initials(n){return String(n||"?").slice(0,2).toUpperCase();}
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function chatStatus(c){
  if(c.unread&&c.unread>0)return "attention";
  if(c.last_activity){const a=(Date.now()-new Date(c.last_activity).getTime())/60000;if(a<45)return "working";}
  return "idle";
}
function ticker(t){$("#ticker-last").textContent=t;}

/* ---------- THREE setup ---------- */
const sceneEl=$("#scene");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd4ecc8);
scene.fog=new THREE.Fog(0xd4ecc8,900,2100);
const camera=new THREE.PerspectiveCamera(45,1,0.5,5000);
camera.position.set(560,400,560);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
sceneEl.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.domElement.style.cssText="position:absolute;top:0;left:0;pointer-events:none;overflow:hidden";
sceneEl.appendChild(labelRenderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,36,0);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.rotateSpeed=0.75;controls.panSpeed=0.8;
controls.minDistance=26;controls.maxDistance=1200;
controls.minPolarAngle=0.12;controls.maxPolarAngle=1.44;
function resize3d(){const w=sceneEl.clientWidth,h=sceneEl.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);labelRenderer.setSize(w,h);officeCamera.aspect=w/h;officeCamera.updateProjectionMatrix();}
addEventListener("resize",resize3d);
scene.add(new THREE.HemisphereLight(0xffffff,0xc8cfdf,1.05));
const hemi=scene.children[scene.children.length-1];
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(320,480,220);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-780;sun.shadow.camera.right=780;sun.shadow.camera.top=780;sun.shadow.camera.bottom=-780;sun.shadow.camera.far=1800;
sun.shadow.bias=-0.0004;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.22));
const amb=scene.children[scene.children.length-1];
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),new THREE.MeshStandardMaterial({color:0xc7ddba,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const cityG=new THREE.Group(),labelG=new THREE.Group(),fxG=new THREE.Group();
scene.add(cityG);scene.add(labelG);scene.add(fxG);

function std(color,rough){return new THREE.MeshStandardMaterial({color,roughness:rough==null?0.7:rough,metalness:0.05});}
function slotWorld(g){const gx=Array.isArray(g)?g[0]:g.x,gy=Array.isArray(g)?g[1]:g.y;return{x:(gx-4)*SLOT_SP,z:(gy-3)*SLOT_SP};}

function windowTexture(seed,floors){
  const cv=document.createElement("canvas");cv.width=192;cv.height=64*floors;
  const ctx=cv.getContext("2d");
  ctx.fillStyle=NIGHT?"#232a45":"#f5f7fc";ctx.fillRect(0,0,cv.width,cv.height);
  const cols=5,rows=floors*4,cw=cv.width/cols,ch=cv.height/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const k=hash(seed+"w"+r+"_"+c)%100;
    let fill;
    if(NIGHT){
      if(k<55)fill="#ffd66b";else if(k<78)fill="#5a6b9c";else fill="#141a30";
    }else{
      fill="#c9d0e2";
      if(k<32)fill="#31406b";else if(k<40)fill="#ffd66b";
    }
    ctx.fillStyle=fill;
    ctx.fillRect(c*cw+cw*0.22,r*ch+ch*0.22,cw*0.56,ch*0.5);
  }
  const tx=new THREE.CanvasTexture(cv);
  tx.wrapS=THREE.RepeatWrapping;tx.wrapT=THREE.RepeatWrapping;
  tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}

let ROBOT={},BLIGHT={},LBL=[],BLINK=[],WALK={},PROJECT_MAIN={};
function clearCity(){
  cityG.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});
  cityG.clear();fxG.clear();
  LBL.forEach(l=>{l.obj.removeFromParent();l.div.remove();});
  labelRenderer.domElement.querySelectorAll(".bub3d").forEach(b=>b.remove());
  LBL=[];ROBOT={};BLIGHT={};BLINK=[];WALK={};
}
function trees3D(){
  const occ=new Set(CHATS.map(c=>c.pos.x+","+c.pos.y));
  const g=new THREE.Group();
  const trunkM=std(0x8a6a48,0.9),leafA=std(0x7fb069,0.85),leafB=std(0x6a9c58,0.85);
  for(let gx=0;gx<=8;gx++)for(let gy=0;gy<=7;gy++){
    if(occ.has(gx+","+gy))continue;
    if(gx===4||gy===3)continue;
    if(Math.abs((gx-4)*SLOT_SP)<75&&Math.abs((gy-3)*SLOT_SP)<75)continue;
    if(hash("tree"+gx+"_"+gy)%10>=6)continue;
    const p=slotWorld([gx,gy]);
    const x=p.x+(hash("jx"+gx+"_"+gy)%22-11),z=p.z+(hash("jz"+gx+"_"+gy)%22-11);
    const s=0.8+(hash("ts"+gx+"_"+gy)%50)/100;
    const t=new THREE.Group();

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),tip=$("#tooltip");
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1;
  pointer.y=-((e.clientY-r.top)/r.height)*2+1;
  const cam=office.active?officeCamera:camera;
  raycaster.setFromCamera(pointer,cam);
  const hits=raycaster.intersectObjects(office.active?[officeScene]:[cityG,fxG],true);
  for(const h of hits){
    let o=h.object;
    while(o){
      if(o.userData.agentid)return{agentid:o.userData.agentid};
      if(o.userData.chatid)return{chatid:o.userData.chatid};
      if(o.userData.plaza)return{plaza:1};
      o=o.parent;
    }
  }
  return{};
}
let pd=null;
renderer.domElement.addEventListener("pointerdown",e=>{pd={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener("pointerup",e=>{
  if(pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<6){
    const hit=pick(e);
    if(hit.agentid)openAgent(hit.agentid);
    else if(hit.chatid){cur.tab="chat";openChat(hit.chatid);openOffice(hit.chatid);}
    else if(hit.plaza){cur.chat="plaza";renderPanel();panel.classList.add("open");}
    else closePanel();
  }
  pd=null;
});
let hoverT=0;
renderer.domElement.addEventListener("pointermove",e=>{
  const now=Date.now();
  if(now-hoverT<70)return;
  hoverT=now;
  const hit=pick(e);
  let html=null;
  if(hit.agentid&&AGENTS[hit.agentid]){
    const a=AGENTS[hit.agentid];
    html="<b>"+esc(a.name)+"</b><span>"+esc(a.role)+" — "+ST_LABEL[a.status]+" · "+esc(a.task)+"</span>";

const clock3=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock3.getDelta(),0.05);
  const t=clock3.elapsedTime;
  if(office.active){
    officeControls.update();
    updateOffice(dt,t);
    renderer.render(officeScene,officeCamera);

  }
  for(const id in ROBOT){

    R.g.position.y=1.6+Math.sin(t*1.7+R.phase)*1.5;
    if(R.ring.visible){

      R.ring.scale.set(s,s,s);

    }

  BLINK.forEach((b,i)=>{b.material.emissiveIntensity=1+Math.max(0,Math.sin(t*3+i*1.3))*1.2;});

function chatFront(t){
  const p=t.pos3||slotWorld(t.pos);
  const d=new THREE.Vector2(-p.x,-p.z).normalize();
  return{x:p.x+d.x*40,z:p.z+d.y*40};
}
function startWalk(id){
  const R=ROBOT[id],a=AGENTS[id];
  if(!R||!a||WALK[id]||a.name==="Tu"||a.status==="attention")return;
  const home=a.chat;
  const linked=PROJECT_MAIN[home.project];
  let tgt=null;
  const others=CHATS.filter(x=>x.id!==home.id);
  const pref=others.filter(x=>x===linked);
  const pool=pref.length&&Math.random()<0.75?pref:others;
  tgt=pool[Math.floor(Math.random()*pool.length)];
  if(!tgt||!tgt.pos3)return;
  const f=chatFront(tgt);
  const path=[{x:R.home.x,z:R.home.z},{x:R.home.x,z:0},{x:f.x,z:0},{x:f.x,z:f.z}];
  WALK[id]={path,seg:0,pos:{x:R.g.position.x,z:R.g.position.z},state:"out",pause:0,speed:13+Math.random()*5,tgt};
}
function updateCityWalks(dt){
  for(const id in WALK){
    const W=WALK[id],R=ROBOT[id];
    if(!R||!AGENTS[id]){delete WALK[id];continue;}
    if(W.state==="pause"){
      W.pause-=dt;
      if(W.pause<=0){
        transientBubble(AGENTS[id].chat,AGENTS[id],"Torno al mio ufficio");
        W.path=W.path.slice().reverse();
        W.seg=1;W.state="back";
      }
      continue;
    }
    const tgtP=W.path[W.seg];
    const dx=tgtP.x-W.pos.x,dz=tgtP.z-W.pos.z,d=Math.hypot(dx,dz);
    if(d<0.8){
      W.seg++;
      if(W.seg>=W.path.length){
        if(W.state==="out"){W.state="pause";W.pause=8+Math.random()*6;transientBubble(AGENTS[id].chat,AGENTS[id],"In visita: "+W.tgt.name);}
        else delete WALK[id];
      }
      continue;
    }
    const step=Math.min(W.speed*dt,d);
    W.pos.x+=dx/d*step;W.pos.z+=dz/d*step;
    R.g.position.x=W.pos.x;R.g.position.z=W.pos.z;
    R.g.rotation.y=Math.atan2(dx,dz);
  }
}

},7000);

function officeAssignment(c){

    if(f.startsWith("agent_")&&!senders.includes(f))senders.push(f);

function updateOffice(dt,t){
  for(const o of office.robots){
    if(o.state==="wait"){
      o.delay-=dt;
      if(o.delay<=0)o.state="walk";
      continue;
    }
    if(o.state==="walk"){
      const dx=o.target.x-o.pos.x,dz=o.target.z-o.pos.z,d=Math.hypot(dx,dz);
      if(d<0.4){
        o.state="idle";
        o.g.position.x=o.target.x;o.g.position.z=o.target.z;
        if(o.target.yaw!=null)o.g.rotation.y=o.target.yaw;
        o.pos.x=o.target.x;o.pos.z=o.target.z;
        continue;
      }
      const step=Math.min(o.speed*dt,d);
      o.pos.x+=dx/d*step;o.pos.z+=dz/d*step;
      o.g.position.x=o.pos.x;o.g.position.z=o.pos.z;
      o.g.rotation.y=Math.atan2(dx,dz);
      o.g.position.y=Math.abs(Math.sin(t*9+o.phase))*0.3;
    }else{
      o.g.position.y=Math.sin(t*1.8+o.phase)*0.2;
      if(o.kind==="coffee"){
        o.wt-=dt;
        if(o.wt<=0){
          o.wt=4+Math.random()*5;
          o.target={x:8+Math.random()*6.5,z:4.5+Math.random()*4.6,yaw:Math.random()*6.3};
          o.state="walk";
        }
      }else if(o.kind==="meeting"){
        o.g.rotation.y=Math.atan2(12-o.pos.x,-6-o.pos.z);
      }
    }
  }
}

    body.innerHTML=overviewHTML();
  }else{
    const c=CHATS.find(x=>x.id===cur.chat);
    if(!c)return closePanel();
    const st=chatStatus(c),col=PROJECTS[c.project].color;
    $("#p-dot").style.background=col;
    $("#p-title").textContent=c.name;
    $("#p-proj").textContent=PROJECTS[c.project].name+" · "+c.agents.length+" agenti";
    const pill=$("#p-status");
    pill.textContent=ST_LABEL[st];
    pill.style.color=ST_CSS[st];pill.style.borderColor=ST_CSS[st]+"55";pill.style.background=ST_CSS[st]+"18";
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===cur.tab));
    if(cur.tab==="chat")body.innerHTML=chatHTML(c);
    else if(cur.tab==="team")body.innerHTML=teamHTML(c);
    else body.innerHTML=logHTML(c);
  }
  body.scrollTop=isPlaza?0:sc;
}
$("#p-close").addEventListener("click",closePanel);
$("#p-body").addEventListener("click",e=>{
  if(e.target.closest("[data-back]")){cur.agent=null;cur.tab="chat";renderPanel();return;}
  if(e.target.id==="ad-chat"){cur.agent=null;cur.tab="chat";renderPanel();return;}
  if(e.target.id==="ad-dm"&&cur.agent){dmOpen(AGENTS[cur.agent]);return;}
  if(e.target.id==="ad-report"&&cur.agent){reportOpen(cur.agent);return;}
  const r=e.target.closest("[data-open]");
  if(r){cur.agent=null;cur.tab="chat";openChat(r.dataset.open);}
});
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]");
  if(b){cur.agent=null;cur.tab=b.dataset.tab;renderPanel();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(office.active){closeOffice();return;}closePanel();}});
let toastT;
function toast(t){
  const el=$("#toast");el.textContent=t;el.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600);
}
$("#p-open").addEventListener("click",()=>{
  const c=cur.agent?AGENTS[cur.agent].chat:CHATS.find(x=>x.id===cur.chat);
  window.open(c?chatUrl(c):CONFIG.genteamUrl,"_blank");
});
$("#p-report").addEventListener("click",()=>reportOpen(null));
$("#p-sim").addEventListener("click",()=>{
  if(cur.chat&&cur.chat!=="plaza")simMessage(cur.chat);
});
function simMessage(cid){
  const c=CHATS.find(x=>x.id===cid);
  if(!c)return;
  const a=c.agents[Math.floor(Math.random()*c.agents.length)];
  const msgs=["Bozza pronta per la tua revisione.","Aggiornato il task board.","Invio il report tra poco.","Fatto — dimmi tu se procedo.","Ho preparato due alternative."];
  const txt=msgs[Math.floor(Math.random()*msgs.length)];
  c.messages.push({from:a.id,text:txt,time:fmtClock()});
  c.activity.push({time:fmtClock(),text:a.name+": "+txt});
  transientBubble(c,a,txt);
  if(cur.chat===cid&&!cur.agent)renderPanel();
  updateStats();
}
function updateStats(){
  let tw=0,ta=0;
  CHATS.forEach(c=>c.agents.forEach(a=>{if(a.status==="working")tw++;if(a.status==="attention")ta++;}));
  $("#st-agents").textContent=tw;
  $("#st-att").textContent=ta;
  if(liveMode){
    const n=new Date();
    $("#st-clock").textContent=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
    $("#st-clocklab").textContent="ora reale";
  }else{
    $("#st-clock").textContent=fmtClock();
    $("#st-clocklab").textContent="ora demo";
  }
}
function tick(){
  clockMin=(clockMin+5)%1440;
  CHATS.forEach(c=>{
    if(Math.random()<0.22&&c.agents.length){
      const a=c.agents[Math.floor(Math.random()*c.agents.length)];
      const msgs=["Aggiornamento: task avanzati.","Nuova bozza nel documento condiviso.","Richiedo un feedback su" + " " + c.name+".","Completato il controllo di oggi."];
      const txt=msgs[Math.floor(Math.random()*msgs.length)];
      c.messages.push({from:a.id,text:txt,time:fmtClock()});
      c.activity.push({time:fmtClock(),text:a.name+": "+txt});
      transientBubble(c,a,txt);
      if(Math.random()<0.3)a.status=Math.random()<0.5?"working":"idle";
    }
  });
  applyStatuses();
  updateStats();
  if(panel.classList.contains("open"))renderPanel();
}
function refreshDynamic(){applyStatuses();updateStats();if(panel.classList.contains("open"))renderPanel();}
function safeBuild(){
  try{buildCity();return true;}
  catch(err){console.error("[GenCity]",err);ticker("⚠️ Errore città: "+(err&&err.message?err.message:err));return false;}
}
function applyData(json){
  liveMode=true;
  PROJECTS=json.projects&&Object.keys(json.projects).length?json.projects:DEMO_PROJECTS;
  CHATS=json.chats.map((c,i)=>Object.assign({},c,{pos:{x:POSITIONS[i%POSITIONS.length][0],y:POSITIONS[i%POSITIONS.length][1]}}));
  const ok=safeBuild();
  if(ok){
    if(json.mode==="full")ticker("GenTeam collegato: "+CHATS.length+" edifici con dialogo live");
    else ticker("GenTeam collegato (privacy: solo stati) — "+CHATS.length+" edifici. Aggiornato "+(json.generated_at||"").slice(11,16));
  }
}
async function refreshLive(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(!r.ok)return;
    const prev={};CHATS.forEach(c=>prev[c.id]=c.messages.length);
    const json=await r.json();
    applyData(json);
    CHATS.forEach(c=>{
      if((prev[c.id]||0)<c.messages.length&&c.agents.length)transientBubble(c,c.agents[0],"Nuovi messaggi");
    });
    refreshDynamic();
  }catch(e){}
}
async function boot(){
  syncNight();
  let loaded=false;
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(r.ok&&await r.json().then(j=>{applyData(j);return true;}).catch(()=>false))loaded=true;
  }catch(e){}
  if(!loaded){
    CHATS.forEach((c,i)=>Object.assign(c,{pos:{x:POSITIONS[i%POSITIONS.length][0],y:POSITIONS[i%POSITIONS.length][1]}}));
    if(safeBuild())ticker("Modalità demo — dati simulati. Esegui bridge.py per collegare GenTeam.");
  }
  startTimers();
}
let live=true,fakeTimer=null,refetchTimer=null;
function startTimers(){
  clearInterval(fakeTimer);clearInterval(refetchTimer);
  if(!live)return;
  if(liveMode)refetchTimer=setInterval(refreshLive,60000);
  else fakeTimer=setInterval(tick,5000);
}
$("#live").addEventListener("change",e=>{
  live=e.target.checked;
  startTimers();
  toast(live?"Live attivata":"Live in pausa");
});
function applyNightEnv(){
  if(NIGHT){
    scene.background.set(0x10162c);scene.fog.color.set(0x10162c);scene.fog.near=700;scene.fog.far=1900;
    ground.material.color.set(0x22352b);
    sun.color.set(0x7788cc);sun.intensity=0.35;sun.position.set(320,480,-220);
    hemi.intensity=0.55;hemi.color.set(0x334066);hemi.groundColor.set(0x111827);
    amb.intensity=0.32;
  }else{
    scene.background.set(0xd4ecc8);scene.fog.color.set(0xd4ecc8);scene.fog.near=900;scene.fog.far=2100;
    ground.material.color.set(0xc7ddba);
    sun.color.set(0xffffff);sun.intensity=1.5;sun.position.set(320,480,220);
    hemi.intensity=1.05;hemi.color.set(0xffffff);hemi.groundColor.set(0xc8cfdf);
    amb.intensity=0.22;
  }
}
function toggleNight(){
  NIGHT=!NIGHT;
  applyNightEnv();
  $("#nightbtn").textContent=NIGHT?"🌙":"☀️";
  if(office.active){clearOffice();buildOfficeRoom(office.chat);}
  else buildCity();
}
function syncNight(){
  const h=new Date().getHours();
  const want=h<7||h>=19;
  if(want!==NIGHT){NIGHT=want;applyNightEnv();$("#nightbtn").textContent=NIGHT?"🌙":"☀️";}
}
$("#nightbtn").addEventListener("click",toggleNight);
const hashOffice=location.hash.match(/office=(ch_[A-Za-z0-9_]+)/);
const wantNightHash=location.hash.includes("notte");
resize3d();
animate();
boot().then(()=>{
  if(wantNightHash)toggleNight();
  if(hashOffice)setTimeout(()=>openOffice(hashOffice[1]),600);
});
</script>
</body>
</html>
